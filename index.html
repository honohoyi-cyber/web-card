    .action {
      display: grid;
      place-items: center;
      min-height: 46px;
      padding: 8px 12px;
      border: 1px solid #bbc7d0;
      border-radius: 9px;
      background: transparent;
      color: #2b3c4c;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .primary {
      min-height: 64px;
      padding: 14px 16px;
      background: #2b3c4c;
      border-color: #2b3c4c;
      color: white;
      font-size: 1.125rem;
    }
    :focus-visible { outline: 3px solid #55738a; outline-offset: 2px; }
    #status { margin: 0; color: #485a69; font-size: .86rem; }
    #status:not(:empty) { margin-top: 10px; }
    header { position: relative; overflow: hidden; }
    header::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(112deg, transparent 28%, #e5faff33 45%, #fff9dbaa 50%, transparent 67%);
      transform: translateX(-100%);
      mix-blend-mode: screen;
    }
    header.shine::after { animation: shine .55s ease-out; }
    @keyframes shine {
      0% { opacity: 0; transform: translateX(-100%); }
      32% { opacity: .65; }
      100% { opacity: 0; transform: translateX(100%); }
    }
    #motion { margin-top: 12px; font-size: .85rem; }
    #motion[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      header.shine::after { animation: none; }
    }

<body>
  <main aria-labelledby="name">
    <header>
      <p class="role" id="role">무적사원</p>
      <h1 id="name">부적합사냥꾼</h1>
      <p class="intro">조짐받고 싶은자여 연락바람</p>
    </header>
    <div class="details">
      <h2>담당 업무</h2>
      <ul>
        <li>현장조지기</li>
        <li>업체조지기</li>
        <li>동료조지기</li>
      </ul>
      <address>
        <a href="tel:01089276969">010-8927-6969</a>
        <a id="email" href="mailto:hunterKB@example.com">hunterKB@example.com</a>
      </address>
      <div class="actions">
        <button class="action primary" type="button" id="save">연락처 저장</button>
        <a class="action" href="tel:01089276969">전화 걸기</a>
        <button class="action" type="button" id="copy">메일 주소 복사</button>
      </div>
      <p id="status" role="status"></p>
      <button class="action" type="button" id="motion" hidden>움직임 효과 켜기</button>
    </div>
  </main>
  <script>
    const emailLink = document.querySelector("#email");
    const email = emailLink.textContent.trim();
    const status = document.querySelector("#status");
    const banner = document.querySelector("header");
    const motionButton = document.querySelector("#motion");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const motionSensor = window.DeviceMotionEvent;
    const orientationSensor = window.DeviceOrientationEvent;
    let lastFlash = -Infinity;
    let lastTilt;

    function flash() {
      const now = performance.now();
      if (reducedMotion.matches || now - lastFlash < 850) return;
      lastFlash = now;
      banner.classList.add("shine");
    }

    banner.addEventListener("animationend", () => banner.classList.remove("shine"));
    reducedMotion.addEventListener("change", () => banner.classList.remove("shine"));

    function watchMotion() {
      window.addEventListener("devicemotion", ({acceleration, rotationRate}) => {
        const {x, y, z} = acceleration ?? {};
        const {alpha, beta, gamma} = rotationRate ?? {};
        if (Math.hypot(x ?? 0, y ?? 0, z ?? 0) > 1.3 ||
            Math.hypot(alpha ?? 0, beta ?? 0, gamma ?? 0) > 25) flash();
      });
      window.addEventListener("deviceorientation", ({beta, gamma}) => {
        if (beta == null || gamma == null) return;
        if (lastTilt && Math.hypot(beta - lastTilt.beta, gamma - lastTilt.gamma) >= 7) {
          flash();
          lastTilt = {beta, gamma};
        } else if (!lastTilt) {
          lastTilt = {beta, gamma};
        }
      });
    }

    const permissionSensor = [motionSensor, orientationSensor]
      .find(sensor => typeof sensor?.requestPermission === "function");
    if (permissionSensor && !reducedMotion.matches) {
      motionButton.hidden = false;
      motionButton.addEventListener("click", async () => {
        try {
          if (await permissionSensor.requestPermission() === "granted") {
            watchMotion();
            motionButton.hidden = true;
            status.textContent = "움직임 효과를 켰습니다.";
            flash();
            return;
          }
        } catch {
          // Some file viewers do not expose motion sensors.
        }
        status.textContent = "이 브라우저에서 움직임 센서에 접근할 수 없습니다.";
      });
    } else if (!permissionSensor) {
      watchMotion();
    }

    document.querySelector("#save").addEventListener("click", () => {
      const name = document.querySelector("#name").textContent.trim();
      const role = document.querySelector("#role").textContent.trim();
      const card = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:" + name + ";;;;",
        "FN:" + name,
        "TITLE:" + role,
        "TEL;TYPE=CELL:+821089276969",
        "EMAIL;TYPE=INTERNET:" + email,
        "END:VCARD",
        ""
      ].join("\r\n");
      const url = URL.createObjectURL(new Blob([card], { type: "text/vcard;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = name + ".vcf";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      status.textContent = "받은 .vcf 파일을 열어 연락처에 추가하세요.";
    });

    document.querySelector("#copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(email);
        status.textContent = "메일 주소를 복사했습니다.";
      } catch {
        const field = document.createElement("textarea");
        field.value = email;
        field.readOnly = true;
        field.style.cssText = "position:fixed;inset:0 auto auto 0;opacity:0";
        document.body.append(field);
        field.select();
        field.setSelectionRange(0, email.length);
        let copied = false;
        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        } finally {
          field.remove();
          document.querySelector("#copy").focus();
        }
        if (copied) {
          status.textContent = "메일 주소를 복사했습니다.";
        } else {
          const range = document.createRange();
          range.selectNodeContents(emailLink);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          status.textContent = "메일 주소를 길게 눌러 복사해 주세요.";
        }
      }
    });
  </script>
</body>
</html>
